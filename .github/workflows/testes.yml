name: Testes (regras e ponta a ponta)
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Instalar dependências
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Servir o site localmente
        run: (npx --prefix tests serve -l 5000 . > /tmp/serve.log 2>&1 &) && sleep 3 && curl -sf http://localhost:5000/app > /dev/null
      - name: Emuladores + testes
        run: npx --prefix tests firebase emulators:exec --project demo-lavaflux --only firestore,auth "node tests/regras.test.mjs && node tests/e2e.mjs && node tests/e2e-pet.mjs"
